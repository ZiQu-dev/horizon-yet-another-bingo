[package]
name = "mod-bingo_native"
version = "0.0.1"
edition = "2024"

[dependencies]
# The launcher points this at the Horizon source it builds the game from.
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "7b59041a89c3f1bc8e458f43d6b8ec48a0f814d3" }
# The client half itself: std-only, tested apart from the game (it lives inside this package so it is staged with it).
horizon-bingo = { path = "../horizon-bingo" }
# The always-on warning about missing item names goes to Horizon's log (`horizon_client::logging::write_as`), which takes a
# `log::Level`. The crate is in Horizon's Cargo.lock already.
log = "0.4"
